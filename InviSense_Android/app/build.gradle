plugins {
    id 'com.android.application'
}

android {
    namespace 'com.invisense.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.invisense.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // ─── IMPORTANT ────────────────────────────────────────────────────────
        // Change this to your server's real IP/domain before building.
        // If testing on a phone via USB with PC running the Django server:
        //   Use your PC's local IP (e.g. 192.168.1.10), NOT 127.0.0.1
        // If deployed to a cloud server:
        buildConfigField "String", "BASE_URL", '"https://invisense-project.onrender.com"'
        // ──────────────────────────────────────────────────────────────────────
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Android UI
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // QR code scanner
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'

    // Shared preferences helper
    implementation 'androidx.preference:preference:1.2.1'
}
